<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../css/styles.css">
<title>Team Mood System</title>


</head>

<body>
  <!-- 🔥 MENU BUTTON -->
<button class="menu-btn" id="menuBtn">☰</button>

<!-- 🔥 OVERLAY -->
<div class="overlay" id="overlay"></div>

<!-- 🔥 SIDEBAR -->
<nav class="sidebar" id="sidebar">

  <div class="sidebar-header">
    <h3>Vibe Check</h3>
    <button id="closeBtn">✕</button>
  </div>

  <a href="checkin.html">💜 Чек-ин</a>
  <a href="journal.html">📘 Дневник</a>
  <a href="insights.html">📊 Аналитика</a>
  <a href="calendar.html">📅 Календарь</a>
  <a href="tags.html">🏷 Теги</a>
  <a href="team.html">👥 Команда</a>
  <a href="support.html">🆘 Поддержка</a>
  <a href="profile.html">👤 Профиль</a>
  <a href="export.html">📤 Экспорт</a>
  <a href="metod.html">📘 О методологии</a>
  <a href="npumin.html">🔔 Напоминания</a>

</nav>

<div class="container">

<h1>Командный Dashboard</h1>

<div class="card">

  <button class="create-btn" onclick="openModal()">＋ создать группу</button>

  <div id="groups"></div>

</div>

<!-- CHAT -->
<div class="card" id="chatView">

  <h3 id="title"></h3>

  <div class="chat-box" id="chatBox"></div>

  <input id="msg" placeholder="сообщение"
    style="width:100%;padding:8px;margin-top:10px;border-radius:8px;border:1px solid #ddd">

  <button onclick="send()"
    style="margin-top:8px;padding:8px;border:none;border-radius:8px;background:#6366f1;color:white">
    Отправить
  </button>

  <div class="mood">
    <p>Настроение:</p>
    <button onclick="mood(1)">😡</button>
    <button onclick="mood(2)">😕</button>
    <button onclick="mood(3)">😐</button>
    <button onclick="mood(4)">🙂</button>
    <button onclick="mood(5)">😄</button>
  </div>

  <button onclick="back()">назад</button>

</div>

<!-- CHART -->
<div class="card chart-card">

  <h3>📊 График настроения</h3>

  <div class="chart" id="chart"></div>

  <div class="info" id="info">нажми на день</div>

</div>

</div>

<!-- MODAL -->
<div class="modal" id="modal">

  <div class="modal-content">

    <h3>Создать группу</h3>

    <input id="groupName" placeholder="Название">

    <div class="modal-actions">

      <button class="primary" onclick="createGroup()">создать</button>
      <button class="secondary" onclick="closeModal()">отмена</button>

    </div>

  </div>

</div>

<!-- TOAST -->
<div id="toast"></div>

<script>

let groups=[
{
  id:1,
  name:"Frontend Team",
  messages:[],
  moods:[
    {day:"Пн",value:3},
    {day:"Вт",value:4},
    {day:"Ср",value:2},
    {day:"Чт",value:5},
    {day:"Пт",value:4},
    {day:"Сб",value:3},
    {day:"Вс",value:5}
  ]
}
];

let current=null;

/* GROUPS */
function renderGroups(){

  let box=document.getElementById("groups");
  box.innerHTML="";

  groups.forEach(g=>{

    let div=document.createElement("div");
    div.className="group";

    div.innerHTML=`
      <div>${g.name}</div>
      <div>
        <button onclick="openChat(${g.id})">open</button>
        <button onclick="leave(${g.id})">exit</button>
        <button onclick="del(${g.id})">del</button>
      </div>
    `;

    box.appendChild(div);
  });
}

/* MODAL */
function openModal(){ modal.style.display="flex"; }
function closeModal(){ modal.style.display="none"; }

function createGroup(){

  let name=groupName.value;
  if(!name) return;

  groups.push({
    id:Date.now(),
    name,
    messages:[],
    moods:[]
  });

  groupName.value="";
  closeModal();
  renderGroups();
}

/* CHAT */
function openChat(id){
  current=groups.find(g=>g.id===id);
  chatView.style.display="block";
  title.innerText=current.name;
  renderChat();
  renderChart();
}

function renderChat(){
  chatBox.innerHTML="";
  current.messages.forEach(m=>{
    let d=document.createElement("div");
    d.className="message";
    d.innerText=m;
    chatBox.appendChild(d);
  });
}

function send(){
  if(!msg.value) return;
  current.messages.push("👤 "+msg.value);
  msg.value="";
  renderChat();
}

/* MOOD (1 per day, editable) */
function mood(v){

  let day="Пн";

  let m=current.moods.find(x=>x.day===day);

  if(m){
    m.value=v;
  }else{
    current.moods.push({day,value:v});
  }

  renderChart();
}

/* FIXED CHART */
function renderChart(){

  chart.innerHTML="";

  let data=current?current.moods:groups[0].moods;

  data.forEach(m=>{

    let wrap=document.createElement("div");
    wrap.className="bar-wrap";

    let bar=document.createElement("div");
    bar.className="bar";

    bar.style.height = (m.value / 5) * 100 + "px";

    bar.onclick=()=>show(m);

    let d=document.createElement("div");
    d.className="day";
    d.innerText=m.day;

    wrap.appendChild(bar);
    wrap.appendChild(d);

    chart.appendChild(wrap);
  });
}

function show(m){
  info.innerText=`${m.day}: ${m.value} / 5`;
}

/* BACK */
function back(){
  chatView.style.display="none";
}

/* EXIT FIX */
function leave(id){

  groups = groups.filter(g=>g.id!==id);

  if(current && current.id===id){
    current=null;
    chatView.style.display="none";
  }

  renderGroups();
  renderChart();
  toast("🚪 вы вышли из группы");
}

function del(id){
  groups=groups.filter(g=>g.id!==id);
  renderGroups();
  toast("🗑 удалено");
}

/* TOAST FIX */
function toast(text){
  toastBox.innerText=text;
  toastBox.style.display="block";

  setTimeout(()=>{
    toastBox.style.display="none";
  },2000);
}

/* INIT */
renderGroups();
renderChart();

</script>

</body>
</html>
