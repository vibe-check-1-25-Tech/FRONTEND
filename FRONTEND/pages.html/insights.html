<html lang="ru">
<head>
  <meta charset="UTF-8">

  <link rel="stylesheet" href="../css/styles.css">

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<!-- 🔥 кнопка -->
<button class="menu-btn" id="menuBtn">☰</button>

<!-- 🔥 затемнение -->
<div class="overlay" id="overlay"></div>

<!-- 🔥 sidebar -->
<nav class="sidebar" id="sidebar">

  <div class="sidebar-header">
    <h3>Vibe Check</h3>
    <button id="closeBtn">✕</button>
  </div>

  <a href="checkin.html">💜 Чек-ин</a>
  <a href="journal.html">📘 Дневник</a>
  <a href="insights.html">📊 Аналитика</a>
  <a href="calendar.html">📅 Календарь</a>
  <a href="tags.html">🏷 Теги</a>
  <a href="team.html">👥 Команда</a>
  <a href="support.html">🆘 Поддержка</a>
  <a href="profile.html">👤 Профиль</a>
  <a href="export.html">📤 Экспорт</a>
  <a href="metod.html">  📘 О методологии</a>
  <a href="npumin.html">🔔Напоминания</a>


</nav>

<div class="container">

  <h1>Аналитика</h1>
  <p class="subtitle">Твое настроение за период</p>

  <!-- 🔥 фильтр -->
  <div class="filter">
    <button class="filter-btn active">7 дней</button>
    <button class="filter-btn">30 дней</button>
  </div>

  <!-- 📈 ЛИНЕЙНЫЙ ГРАФИК -->
  <div class="card">
    <h3>Динамика настроения</h3>
    <canvas id="lineChart"></canvas>
  </div>

  <!-- 🟡 КРУГОВАЯ ДИАГРАММА -->
  <div class="card">
    <h3>Распределение эмоций</h3>
    <canvas id="pieChart"></canvas>
  </div>

  <!-- 📊 СРЕДНЕЕ -->
  <div class="card">
    <h3>Среднее настроение</h3>
    <div class="team-score">4.2</div>
  </div>

</div>

<!-- JS графиков -->
<script>

const lineChart = new Chart(document.getElementById('lineChart'), {
  type: 'line',
  data: {
    labels: ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'],
    datasets: [{
      label: 'Настроение',
      data: [3, 4, 2, 5, 4, 3, 5],
      tension: 0.4,
      fill: true
    }]
  },
  options: {
    responsive: true
  }
});

const pieChart = new Chart(document.getElementById('pieChart'), {
  type: 'pie',
  data: {
    labels: ['Плохо','Норм','Хорошо','Отлично'],
    datasets: [{
      data: [2, 3, 4, 5]
    }]
  },
  options: {
    responsive: true
  }
});

</script>

</body>
</html>
