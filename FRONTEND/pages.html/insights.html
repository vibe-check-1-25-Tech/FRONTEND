<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Insights</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="../css/styles.css">

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<button class="menu-btn">☰</button>

<div class="container">

  <h1>Аналитика</h1>
  <p class="subtitle">Твое настроение за период</p>

  <!-- 🔥 фильтр -->
  <div class="filter">
    <button class="filter-btn active">7 дней</button>
    <button class="filter-btn">30 дней</button>
  </div>

  <!-- 📈 ЛИНЕЙНЫЙ ГРАФИК -->
  <div class="card">
    <h3>Динамика настроения</h3>
    <canvas id="lineChart"></canvas>
  </div>

  <!-- 🟡 КРУГОВАЯ ДИАГРАММА -->
  <div class="card">
    <h3>Распределение эмоций</h3>
    <canvas id="pieChart"></canvas>
  </div>

  <!-- 📊 СРЕДНЕЕ -->
  <div class="card">
    <h3>Среднее настроение</h3>
    <div class="team-score">4.2</div>
  </div>

</div>

<!-- JS графиков -->
<script>

const lineChart = new Chart(document.getElementById('lineChart'), {
  type: 'line',
  data: {
    labels: ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'],
    datasets: [{
      label: 'Настроение',
      data: [3, 4, 2, 5, 4, 3, 5],
      tension: 0.4,
      fill: true
    }]
  },
  options: {
    responsive: true
  }
});

const pieChart = new Chart(document.getElementById('pieChart'), {
  type: 'pie',
  data: {
    labels: ['Плохо','Норм','Хорошо','Отлично'],
    datasets: [{
      data: [2, 3, 4, 5]
    }]
  },
  options: {
    responsive: true
  }
});

</script>

</body>
</html>
