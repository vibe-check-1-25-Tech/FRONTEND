</head>

<body>

<button class="menu-btn" id="menuBtn">☰</button>
<div class="overlay" id="overlay"></div>

<nav class="sidebar" id="sidebar">

  <div class="sidebar-header">
    <h3>Vibe Check</h3>
    <button id="closeBtn">✕</button>
  </div>

  <a href="checkin.html">💜 Чек-ин</a>
  <a href="journal.html">📘 Дневник</a>
  <a href="insights.html">📊 Аналитика</a>

</nav>

<main class="container">

  <h1>Как ты сегодня?</h1>

  <!-- MOOD -->
  <div class="mood-grid">

    <div class="mood mood-bad">😢<span>Плохо</span></div>
    <div class="mood mood-ok">😐<span>Ок</span></div>
    <div class="mood mood-normal active">🙂<span>Норм</span></div>
    <div class="mood mood-good">😊<span>Хорошо</span></div>
    <div class="mood mood-excellent">😁<span>Отлично</span></div>

  </div>

  <!-- TAGS (BLOCK STYLE) -->
  <div class="tags-bar">

    <span class="tag">Работа</span>
    <span class="tag">Учёба</span>
    <span class="tag">Сон</span>
    <span class="tag">Хобби</span>
    <span class="tag">Семья</span>
    <span class="tag">Отношения</span>

    <!-- добавить тег -->
    <span class="tag add-tag">＋ Добавить</span>

  </div>

  <!-- NOTE + PHOTO -->
  <div class="note-box">

    <textarea placeholder="Напиши пару слов..."></textarea>

    <label class="photo-btn">
                📷 Фото
      <input type="file" accept="image/*" capture="environment" hidden>
    </label>

  </div>

  <button class="save-btn">Сохранить</button>

</main>

</body>
