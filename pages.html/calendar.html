<div class="calendar-page">
  <h1>📅 Календарь настроения</h1>
  <p class="calendar-subtitle">Отслеживайте своё настроение по дням</p>

  <div class="calendar-card">
    <div class="calendar-header">
      <button class="calendar-nav-btn" id="prevMonthBtn">← Назад</button>
      <h2 id="currentMonthYear">Май 2026</h2>
      <button class="calendar-nav-btn" id="nextMonthBtn">Вперед →</button>
    </div>

    <div class="calendar-weekdays">
      <div class="weekday">Пн</div>
      <div class="weekday">Вт</div>
      <div class="weekday">Ср</div>
      <div class="weekday">Чт</div>
      <div class="weekday">Пт</div>
      <div class="weekday">Сб</div>
      <div class="weekday">Вс</div>
    </div>

    <!-- ========== ЗДЕСЬ ТЫ ПРОПИСЫВАЕШЬ ДНИ МЕСЯЦА ========== -->
    <div class="calendar-grid" id="calendarGrid"></div>

    <div class="calendar-legend">

      <div class="legend-item">
        <span class="legend-color mood-1"></span>Плохо</div>
      <div class="legend-item">
        <span class="legend-color mood-2"></span>Не очень</div>
      <div class="legend-item">
        <span class="legend-color mood-3"></span>Нормально</div>
      <div class="legend-item">
        <span class="legend-color mood-4"></span>Хорошо</div>
      <div class="legend-item">
        <span class="legend-color mood-5"></span>Отлично</div>
    </div>
  </div>
</div>
<!-- МОДАЛЬНОЕ ОКНО -->
<div id="dayModal" class="day-modal">
  <div class="day-modal-content">
    <h3 id="modalDate"></h3>
    <div id="modalMood" class="mood-icon"></div>
    <div id="modalNote" class="note"></div>
    <button class="day-modal-close" id="closeModalBtn">Закрыть</button>
  </div>
</div>
<script src="../js/app.js"></script>
<script src="../js/api.js"></script>
<script src="../js/calendar.js"></script>
