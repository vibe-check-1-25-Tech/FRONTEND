<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mood Team System - Ultimate</title>
    <script src="https://jsdelivr.net"></script>
    <link rel="stylesheet" href="../css/styles.css">
    
    
</head>
<button class="menu-btn">☰</button>

<!-- 🔥 кнопка -->
<button class="menu-btn" id="menuBtn">☰</button>

<!-- 🔥 затемнение -->
<div class="overlay" id="overlay"></div>

<!-- 🔥 sidebar -->
<nav class="sidebar" id="sidebar">

  <div class="sidebar-header">
    <h3>Vibe Check</h3>
    <button id="closeBtn">✕</button>
  </div>

  <a href="checkin.html">Главная</a>
  <a href="journal.html">Дневник</a>
  <a href="insights.html">Аналитика</a>
  <a href="calendar.html">Календарь</a>
  <a href="tags.html">Теги</a>
  <a href="team.html">Команда</a>
  <a href="support.html">Поддержка</a>
  <a href="profile.html">Профиль</a>
  <a href="export.html">Экспорт</a>
<a href="metod.html"> О методологии</a>
  <a href="npumin.html">Напоминания</a>

</nav>
<body>

    <div class="header">
        <div class="container header-flex">
            <span>MOOD SYSTEM</span>
            <button class="add-btn" onclick="document.getElementById('createModal').style.display='flex'">+</button>
        </div>
    </div>

    <div class="container">
        <!-- КОМАНДЫ -->
        <div id="teams" class="screen active">
            <div class="search-container">
                <input type="text" placeholder="🔍 Поиск команд..." class="search-input" oninput="filterList('teamList', this.value)">
            </div>
            <div id="teamList"></div>
        </div>

        <!-- ЧАТЫ -->
        <div id="chats" class="screen">
            <div class="search-container">
                <input type="text" placeholder="🔍 Найти человека..." class="search-input" oninput="filterList('dmList', this.value)">
            </div>
            <div id="dmList"></div>
        </div>
        
        <!-- MOOD -->
        <div id="mood" class="screen">
            <div style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 20px;">
                <button onclick="pickM('😡')" style="font-size:35px; aspect-ratio:1; border:none; background:#fff; border-radius:15px; cursor:pointer;">😡</button>
                <button onclick="pickM('😕')" style="font-size:35px; aspect-ratio:1; border:none; background:#fff; border-radius:15px; cursor:pointer;">😕</button>
                <button onclick="pickM('😐')" style="font-size:35px; aspect-ratio:1; border:none; background:#fff; border-radius:15px; cursor:pointer;">😐</button>
                <button onclick="pickM('🙂')" style="font-size:35px; aspect-ratio:1; border:none; background:#fff; border-radius:15px; cursor:pointer;">🙂</button>
                <button onclick="pickM('😄')" style="font-size:35px; aspect-ratio:1; border:none; background:#fff; border-radius:15px; cursor:pointer;">😄</button>
            </div>
            <div id="moodPick" style="text-align:center; font-weight:900; margin-bottom:20px; color:var(--primary);">Выбрано: -</div>
            <textarea id="moodNote" placeholder="Заметка..." style="width:100%; height:80px; border-radius:15px; border:1px solid #ddd; padding:15px; box-sizing:border-box; margin-bottom:15px; outline:none; font-family:inherit;"></textarea>
            <button onclick="saveStats()" style="width:100%; padding:18px; border-radius:15px; border:none; background:var(--primary); color:white; font-weight:bold; cursor:pointer;">Сохранить данные</button>
        </div>

        <!-- АНАЛИТИКА -->
        <div id="analytics" class="screen">
            <div class="search-container">
                <input type="text" placeholder="🔍 Поиск по графикам..." class="search-input" oninput="filterCharts(this.value)">
            </div>
            <div id="chartsContainer">
                <div class="chart-card" data-name="frontend"><canvas id="chartF"></canvas></div>
                <div class="chart-card" data-name="backend"><canvas id="chartB"></canvas></div>
            </div>
        </div>
    </div>

    <!-- ЧАТ МОДАЛКА -->
    <div class="modal-chat" id="chatModal">
        <div class="chat-window">
            <div class="chat-header" onclick="toggleMembers()">
                <div style="flex:1"><b id="chatTitle">Чат</b><br><small style="color:var(--primary); font-size:10px">участники (нажми сюда)</small></div>
                <button onclick="document.getElementById('chatModal').style.display='none'" style="border:none; background:none; font-size:22px; cursor:pointer;">✕</button>
            </div>
            <div id="membersOverlay">
                <h4 style="margin-top:0">Участники:</h4>
                <div id="membersContent"></div>
            </div>
            <div class="chat-box" id="chatBox"></div>
            <div style="padding:15px; border-top:1px solid #eee; display:flex; gap:10px;">
                <input type="text" id="chatInp" placeholder="Сообщение..." style="flex:1; padding:12px; border-radius:10px; border:1px solid #ddd; outline:none;">
                <button onclick="sendMsg()" style="background:var(--primary); color:white; border:none; padding:0 20px; border-radius:10px; cursor:pointer;">➤</button>
            </div>
        </div>
    </div>

    <!-- СОЗДАНИЕ КОМАНДЫ -->
    <div class="modal" id="createModal" style="position:fixed; inset:0; background:rgba(0,0,0,0.5); display:none; align-items:center; justify-content:center; z-index:2000;">
        <div style="background:#fff; padding:30px; border-radius:24px; width:90%; max-width:400px;">
            <h3 style="margin-top:0">Создать команду</h3>
            <input type="text" id="newTeamInput" placeholder="Название..." style="width:100%; padding:14px; border-radius:12px; border:1px solid #ddd; margin-bottom:20px; box-sizing:border-box;">
            <div style="display:flex; gap:10px;">
                <button onclick="document.getElementById('createModal').style.display='none'" style="flex:1; padding:12px; border-radius:10px; border:none; background:#f1f5f9;">Отмена</button>
                <button onclick="addNewTeam()" style="flex:1; padding:12px; border-radius:10px; border:none; background:var(--primary); color:white; font-weight:bold;">Создать</button>
            </div>
        </div>
    </div>

    <div class="nav-bar">
        <div class="container nav-flex">
            <button onclick="go('teams')" class="active-nav">Команды</button>
            <button onclick="go('mood')">Mood</button>
            <button onclick="go('analytics')">Графики</button>
            <button onclick="go('chats')">Чаты</button>
        </div>
    </div>


    <script src="../js/team.js"></script>
</body>
</html>
