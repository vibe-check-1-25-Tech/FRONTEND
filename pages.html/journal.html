<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Личный дневник</title>
<link rel="stylesheet" href="../FRONTEND/css/styles.css">
</head>
<body>

<button class="menu-btn" id="menuBtn">☰</button>
<div class="overlay" id="overlay"></div>

<nav class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <h3>Vibe Check</h3>
    <button id="closeBtn">✕</button>
  </div>

  <a href="checkin.html">Главная</a>
  <a href="journal.html">Дневник</a>
  <a href="insights.html">Аналитика</a>
  <a href="calendar.html">Календарь</a>
  <a href="tags.html">Теги</a>
  <a href="team.html">Команда</a>
  <a href="support.html">Поддержка</a>
  <a href="profile.html">Профиль</a>
  <a href="export.html">Экспорт</a>
  <a href="metod.html">О методологии</a>
  <a href="npumin.html">Напоминания</a>
</nav>

<div class="container">

  <h1 style="text-align: center;">Личный дневник</h1>
  <div class="subtitle" style="text-align: center; margin-bottom: 40px;">Все ваши записи</div>

  <div class="search-wrapper">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" class="search-input" id="searchInput" placeholder="Поиск по заметкам...">
      <button class="search-clear" id="clearSearch">✕</button>
    </div>

    <div class="filter-buttons">
      <button class="mood-filter-btn active" data-mood="all">Все</button>
      <button class="mood-filter-btn" data-mood="1">😢 Плохо</button>
      <button class="mood-filter-btn" data-mood="2">😐 Не очень</button>
      <button class="mood-filter-btn" data-mood="3">🙂 Нормально</button>
      <button class="mood-filter-btn" data-mood="4">😊 Хорошо</button>
      <button class="mood-filter-btn" data-mood="5">😁 Отлично</button>
    </div>

    <div class="search-result-info" id="searchResultInfo"></div>
  </div>

  <div class="entries" id="entriesList"></div>

  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <h3>✏️ Редактирование записи</h3>
      <textarea id="editText" placeholder="Текст заметки..."></textarea>
      <select id="editMood">
        <option value="1">😢 Плохо (1)</option>
        <option value="2">😐 Не очень (2)</option>
        <option value="3">🙂 Нормально (3)</option>
        <option value="4">😊 Хорошо (4)</option>
        <option value="5">😁 Отлично (5)</option>
      </select>
      <div class="modal-actions">
        <button id="saveBtn" class="save">💾 Сохранить</button>
        <button id="modalCloseBtn" class="cancel">❌ Отмена</button>
      </div>
    </div>
  </div>

  <div id="deleteModal" class="modal hidden">
    <div class="modal-box">
      <h3>🗑️ Удалить запись?</h3>
      <p class="delete-text">
        Это действие нельзя отменить
      </p>
      <div class="modal-actions">
        <button id="confirmDeleteBtn" class="delete">
          🗑️ Удалить
        </button>
        <button id="cancelDeleteBtn" class="cancel">
          ❌ Отмена
        </button>
      </div>
    </div>
  </div>

<script src="../js/app.js"></script>
<script src="../js/journal.js"></script>

</body>
</html>
