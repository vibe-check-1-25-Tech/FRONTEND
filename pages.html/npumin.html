<div class="reminders-container">
  <h1>⏰ Напоминания</h1>
  <p class="subtitle">Настройте уведомления, чтобы не забывать делать записи</p>

  <!-- КАРТОЧКА ДОБАВЛЕНИЯ -->
  <div class="reminder-card">
    <h2><i class="fas fa-plus-circle"></i> Новое напоминание</h2>
    
    <div class="time-group">
      <label>Время</label>
      <input type="time" class="time-input" id="reminderTime" value="19:00">
    </div>
    
    <div class="days-group">
      <label>Дни недели</label>
      <div class="days-buttons" id="daysButtons">
        <button class="day-btn" data-day="0">Пн</button>
        <button class="day-btn" data-day="1">Вт</button>
        <button class="day-btn" data-day="2">Ср</button>
        <button class="day-btn" data-day="3">Чт</button>
        <button class="day-btn" data-day="4">Пт</button>
        <button class="day-btn" data-day="5">Сб</button>
        <button class="day-btn" data-day="6">Вс</button>
      </div>
    </div>
    
    <button class="add-btn" id="addReminderBtn">
      <i class="fas fa-bell"></i> Добавить напоминание
    </button>
  </div>

  <!-- СПИСОК НАПОМИНАНИЙ -->
  <div class="reminders-list" id="remindersList"></div>

  <!-- ИНФОРМАЦИЯ -->
  <div class="info-card">
    <div class="info-icon"><i class="fas fa-bell"></i></div>
    <div class="info-text">
      <p>Напоминания приходят в указанное время. Разрешите уведомления в браузере.</p>
    </div>
    <button class="permission-btn" id="requestPermissionBtn">
      <i class="fas fa-bell"></i> Включить уведомления
    </button>
  </div>
</div>

<script src="../js/app.js"></script>
<script src="../js/npumin.js"></script>

</html>
