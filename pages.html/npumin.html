<body>

<div class="overlay" id="overlay"></div>

<nav class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <h3>Vibe Check</h3>
    <button id="closeBtn">✕</button>
  </div>

<div class="container">
  <h1 style="text-align: center;">⏰ Напоминания</h1>
  <p class="subtitle">Настройте уведомления, чтобы не забывать делать записи</p>

  <div class="card">
    <h2>Новое напоминание</h2>
    
    <input type="time" class="time-input" id="reminderTime" value="18:00">
    
    <div class="days-selector">
      <button type="button" class="day-btn" data-day="0">Пн</button>
      <button type="button" class="day-btn" data-day="1">Вт</button>
      <button type="button" class="day-btn" data-day="2">Ср</button>
      <button type="button" class="day-btn" data-day="3">Чт</button>
      <button type="button" class="day-btn" data-day="4">Пт</button>
      <button type="button" class="day-btn" data-day="5">Сб</button>
      <button type="button" class="day-btn" data-day="6">Вс</button>
    </div>
    
    <button class="add-reminder-btn" id="addReminderBtn">➕ Добавить напоминание</button>
  </div>

  <div class="reminders-list" id="remindersList">
    <div class="reminder-item">
      <div class="reminder-info">
        <span class="reminder-icon">🔔</span>
        <span class="reminder-time">18:00</span>
        <span class="reminder-days">Пн, Вт, Ср, Чт, Пт</span>
      </div>
      <div class="reminder-toggle active">
        <div class="circle"></div>
      </div>
      <button class="delete-reminder">🗑</button>
    </div>
    
    <div class="reminder-item">
      <div class="reminder-info">
        <span class="reminder-icon">🔔</span>
        <span class="reminder-time">12:00</span>
        <span class="reminder-days">Сб, Вс</span>
      </div>
      <div class="reminder-toggle">
        <div class="circle"></div>
      </div>
      <button class="delete-reminder">🗑</button>
    </div>
  </div>

</div>

<script src="../js/app.js"></script>
<script src="../js/npumin.js"></script>

</body>
</html>
