 <link rel="stylesheet" href="../css/styles.css">

<!-- 🔥 кнопка -->

<!-- 🔥 затемнение -->
<div class="overlay" id="overlay"></div>

<!-- 🔥 sidebar -->
<nav class="sidebar" id="sidebar">

  <div class="sidebar-header">
    <h3>Vibe Check</h3>
    <button id="closeBtn">✕</button>
  </div>

  <a href="checkin.html">💜 Чек-ин</a>

<div class="container">

  <div class="header">
    <h1>Напоминания</h1>
    <p class="subtitle">
      Настройте уведомления, чтобы не забывать делать записи
    </p>
  </div>

  <!-- Добавление -->
  <div class="card">
    <h2>Новое напоминание</h2>
    <div class="form">
      <input type="time" value="18:00">
      <button>➕ Добавить</button>
    </div>
  </div>

  <!-- Список -->
  <div class="list">

    <div class="item">
      <div class="icon">🔔</div>
      <div class="info">
        <div class="time">20:00</div>
        <div class="days">Пн, Вт, Ср, Чт, Пт</div>
      </div>

      <div class="toggle active">
        <div class="circle"></div>
      </div>

      <button class="delete">🗑</button>
    </div>

    <div class="item">
      <div class="icon">🔔</div>
      <div class="info">
        <div class="time">12:00</div>
        <div class="days">Сб, Вс</div>
      </div>

      <div class="toggle">
        <div class="circle"></div>
      </div>

      <button class="delete">🗑</button>
    </div>

  </div>

</div>

</body>
