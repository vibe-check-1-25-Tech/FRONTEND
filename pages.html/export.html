</head>
<body>

<!-- кнопка меню -->
<button class="menu-btn" id="menuBtn">☰</button>

<!-- затемнение -->
<div class="overlay" id="overlay"></div>

<!-- sidebar -->
<nav class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <h3>Vibe Check</h3>
    <button id="closeBtn">✕</button>
  </div>
  <a href="checkin.html">Главная</a>

<!-- контент -->
<div class="export-container">
  
  <!-- заголовок по центру -->
  <h1 style="text-align: center;">Экспорт данных</h1>
  <p class="subtitle" style="text-align: center;">Скачайте ваши записи</p>

  <!-- PDF -->
  <div class="export-card pdf">
    <div class="export-info">
      <i class="fa-solid fa-file-pdf"></i>
      <div>
        <h3>Экспорт в PDF</h3>
        <p>Скачать отчёт</p>
      </div>
    </div>
    <button class="export-btn" id="exportPDF">Скачать</button>
  </div>

  <!-- CSV -->
  <div class="export-card csv">
    <div class="export-info">
      <i class="fa-solid fa-file-csv"></i>
      <div>
        <h3>Экспорт в CSV</h3>
        <p>Таблица данных</p>
      </div>
    </div>
    <button class="export-btn" id="exportCSV">Скачать</button>
  </div>



<script src="../js/app.js"></script>
<script src="../js/export.js"></script>
