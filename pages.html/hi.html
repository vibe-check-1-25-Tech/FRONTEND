<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Добро пожаловать | Vibe Check</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
 <link rel="stylesheet" href="../FRONTEND/css/styles.css">
</head>
<body class="welcome-page">
<div class="welcome-container">
  <div class="welcome-card">
    
    <!-- ЛОГОТИП -->
    <div class="welcome-logo">
      <div class="welcome-logo-icon">💜</div>
      <div class="welcome-logo-text">Vibe Check</div>
      <div class="welcome-logo-sub">MOOD TRACKER</div>
    </div>
    
    <!-- ПРИВЕТСТВИЕ -->
    <h1 class="welcome-greeting">Добро пожаловать!</h1>
    <p class="welcome-subtitle">Твой персональный трекер настроения и эмоций</p>
    
    <!-- ФИШКИ -->
    <div class="welcome-features">
      <div class="welcome-feature-item">
        <div class="welcome-feature-icon">😊</div>
        <div class="welcome-feature-text">
          <h4>Отслеживай настроение</h4>
          <p>Записывай свои эмоции каждый день</p>
        </div>
      </div>
      <div class="welcome-feature-item">
        <div class="welcome-feature-icon">📊</div>
        <div class="welcome-feature-text">
          <h4>Анализируй тренды</h4>
          <p>Смотри графики и статистику</p>
        </div>
      </div>
      <div class="welcome-feature-item">
        <div class="welcome-feature-icon">👥</div>
        <div class="welcome-feature-text">
          <h4>Поддержка команды</h4>
          <p>Делитесь настроением анонимно</p>
        </div>
      </div>
    </div>
    
    <!-- КНОПКИ -->
    <div class="welcome-buttons">
      <button class="welcome-btn-primary" id="welcomeStartBtn">
        <i class="fas fa-rocket"></i> Начать
      </button>
      <button class="welcome-btn-secondary" id="welcomeLoginBtn">
        <i class="fas fa-sign-in-alt"></i> Уже есть аккаунт
      </button>
    </div>
    
    <div class="welcome-footer">
      <i class="fas fa-heart"></i> Забота о ментальном здоровье
    </div>
    
  </div>
</div>

<script src="../js/welcome.js"></script>
</body>
</html>
