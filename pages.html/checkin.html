<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check-in</title>

<link rel="stylesheet" href="..//FRONTEND/css/styles.css">
</head>

<body>

<!-- MENU -->
<button class="menu-btn" id="menuBtn">☰</button>

<div class="overlay" id="overlay"></div>

<!-- SIDEBAR -->
<nav class="sidebar" id="sidebar">

  <div class="sidebar-header">
    <h3>Vibe Check</h3>
    <button id="closeBtn">✕</button>
  </div>

  <a href="checkin.html">Главная</a>
  <a href="journal.html">Дневник</a>
  <a href="insights.html">Аналитика</a>
  <a href="calendar.html">Календарь</a>
  <a href="tags.html">Теги</a>
  <a href="team.html">Команда</a>
  <a href="support.html">Поддержка</a>
  <a href="profile.html">Профиль</a>
  <a href="export.html">Экспорт</a>
  <a href="metod.html">О методологии</a>
  <a href="npumin.html">Напоминания</a>

</nav>

<!-- MAIN -->
<main class="container">

  <h1>Как ваше настроение?</h1>

  <!-- MOOD GRID (только 5 настроений) -->
  <div class="mood-grid">

    <div class="mood mood-bad">
      😢
      <span>Плохо</span>
    </div>

    <div class="mood mood-ok">
      😐
      <span>Не очень</span>
    </div>

    <div class="mood mood-normal active">
      🙂
      <span>Нормально</span>
    </div>

    <div class="mood mood-good">
      😊
      <span>Хорошо</span>
    </div>

    <div class="mood mood-excellent">
      😁
      <span>Отлично</span>
    </div>

  </div>

  <!-- CARD -->
  <div class="card">

    <!-- TAGS -->
    <div class="tags-bar">

      <span class="tag">Работа</span>
      <span class="tag">Учёба</span>
      <span class="tag">Сон</span>
      <span class="tag">Хобби</span>
      <span class="tag">Семья</span>
      <span class="tag">Отношения</span>
      <button class="add-tag-btn">+ Добавить тег</button>

    </div>

    <!-- NOTE (одна заметка) -->
    <div class="note-box">
      <textarea placeholder="Напиши пару слов..."></textarea>
    </div>

    <!-- SAVE -->
    <button class="save-btn">Сохранить</button>

  </div>

</main>



<!-- SUPPORT MODAL -->
<div class="support-modal" id="supportModal"> 

  <div class="support-content">

    <div id="supportData"></div>

    <button onclick="closeSupportModal()">Закрыть</button>
  </div>


</div>




<script src="../js/checkin.js"></script>
<script src="../js/app.js"></script>

</body>
</html>
