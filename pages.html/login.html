<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход | Vibe Check</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #f6f1e8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      background: white;
      border-radius: 32px;
      padding: 40px 32px;
      max-width: 450px;
      width: 100%;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
      border: 1px solid #ede7f5;
    }

    .login-logo {
      font-size: 48px;
      text-align: center;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      text-align: center;
      color: #1e1b2e;
      margin-bottom: 8px;
    }

    .login-subtitle {
      text-align: center;
      color: #8a8fa3;
      font-size: 14px;
      margin-bottom: 28px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      font-size: 13px;
      font-weight: 600;
      color: #374151;
      display: block;
      margin-bottom: 6px;
    }

    .form-group label i {
      color: #764ba2;
      margin-right: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid #e2e8f0;
      border-radius: 20px;
      font-size: 14px;
      background: #fafafa;
    }

    .form-group input:focus {
      outline: none;
      border-color: #764ba2;
    }

    .forgot-link {
      text-align: right;
      margin-bottom: 20px;
    }

    .forgot-link a {
      font-size: 12px;
      color: #764ba2;
      text-decoration: none;
    }

    .login-btn {
      width: 100%;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 40px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .register-link {
      text-align: center;
      margin-top: 24px;
      font-size: 14px;
      color: #8a8fa3;
    }

    .register-link a {
      color: #764ba2;
      text-decoration: none;
      font-weight: 600;
    }

    /* МОДАЛЬНОЕ ОКНО ЗАБЫЛИ ПАРОЛЬ */
    .reset-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s;
    }

    .reset-modal.show {
      opacity: 1;
      visibility: visible;
    }

    .reset-card {
      background: white;
      border-radius: 32px;
      max-width: 400px;
      width: 90%;
      padding: 28px;
    }

    .reset-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .reset-header i {
      font-size: 28px;
      color: #f59e0b;
    }

    .reset-header h3 {
      font-size: 20px;
      flex: 1;
    }

    .reset-close {
      background: #f3f4f6;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
    }

    .reset-card input {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid #e2e8f0;
      border-radius: 20px;
      margin-bottom: 20px;
    }

    .reset-card button {
      width: 100%;
      padding: 12px;
      border-radius: 40px;
      border: none;
      font-weight: 600;
      cursor: pointer;
    }

    .reset-send {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: white;
    }

    .toast-message {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #10b981;
      color: white;
      padding: 12px 24px;
      border-radius: 50px;
      z-index: 1100;
    }
  </style>
</head>
<body>

<div class="login-card">
  <div class="login-logo">💜</div>
  <h1>Добро пожаловать</h1>
  <p class="login-subtitle">Войдите в свой аккаунт</p>

  <form id="loginForm">
    <div class="form-group">
      <label><i class="fas fa-envelope"></i> Email</label>
      <input type="email" id="loginEmail" placeholder="example@gmail.com">
    </div>
    <div class="form-group">
      <label><i class="fas fa-lock"></i> Пароль</label>
      <input type="password" id="loginPassword" placeholder="Введите пароль">
    </div>
    <div class="forgot-link">
      <a href="#" id="forgotBtn">Забыли пароль?</a>
    </div>
    <button type="submit" class="login-btn">Войти</button>
  </form>

  <div class="register-link">
    Нет аккаунта? <a href="register.html">Зарегистрироваться</a>
  </div>
</div>

<!-- МОДАЛЬНОЕ ОКНО ДЛЯ СБРОСА ПАРОЛЯ -->
<div class="reset-modal" id="resetModal">
  <div class="reset-card">
    <div class="reset-header">
      <i class="fas fa-key"></i>
      <h3>Сброс пароля</h3>
      <button class="reset-close" id="closeResetBtn">✕</button>
    </div>
    <p style="font-size: 14px; color: #6b6b80; margin-bottom: 16px;">
      Введите ваш email, и мы отправим инструкцию для сброса пароля.
    </p>
    <input type="email" id="resetEmail" placeholder="Ваш email">
    <button class="reset-send" id="sendResetBtn">Отправить</button>
  </div>
</div>

<script>
  const resetModal = document.getElementById('resetModal');
  const forgotBtn = document.getElementById('forgotBtn');
  const closeResetBtn = document.getElementById('closeResetBtn');
  const sendResetBtn = document.getElementById('sendResetBtn');
  const resetEmail = document.getElementById('resetEmail');

  function showToast(message) {
    const existing = document.querySelector('.toast-message');
    if (existing) existing.remove();
    const toast = document.createElement('div');
    toast.className = 'toast-message';
    toast.innerHTML = `<i class="fas fa-check-circle"></i> ${message}`;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
  }

  forgotBtn.addEventListener('click', (e) => {
    e.preventDefault();
    resetModal.classList.add('show');
    resetEmail.value = '';
  });

  function closeModal() {
    resetModal.classList.remove('show');
  }

  closeResetBtn.addEventListener('click', closeModal);
  resetModal.addEventListener('click', (e) => {
    if (e.target === resetModal) closeModal();
  });

  sendResetBtn.addEventListener('click', () => {
    const email = resetEmail.value.trim();
    if (!email) {
      alert('Введите email');
      return;
    }
    
    // Здесь будет запрос к бэкенду
    console.log('Запрос сброса пароля для:', email);
    
    // Имитация отправки
    showToast(`Инструкция по сбросу пароля отправлена на ${email}`);
    closeModal();
  });

  // Вход
  document.getElementById('loginForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const email = document.getElementById('loginEmail').value;
    const password = document.getElementById('loginPassword').value;
    console.log('Вход:', { email, password });
    alert('Функция входа в разработке');
  });
</script>
</body>
</html>
