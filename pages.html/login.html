<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход | Vibe Check</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #f6f1e8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      background: white;
      border-radius: 32px;
      padding: 40px 32px;
      max-width: 450px;
      width: 100%;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
      border: 1px solid #ede7f5;
    }

    .login-logo {
      font-size: 48px;
      text-align: center;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      text-align: center;
      color: #1e1b2e;
      margin-bottom: 8px;
    }

    .login-subtitle {
      text-align: center;
      color: #8a8fa3;
      font-size: 14px;
      margin-bottom: 28px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      font-size: 13px;
      font-weight: 600;
      color: #374151;
      display: block;
      margin-bottom: 6px;
    }

    .form-group label i {
      color: #764ba2;
      margin-right: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid #e2e8f0;
      border-radius: 20px;
      font-size: 14px;
      background: #fafafa;
    }

    .form-group input:focus {
      outline: none;
      border-color: #764ba2;
    }

    .forgot-link {
      text-align: right;
      margin-bottom: 20px;
    }

    .forgot-link a {
      font-size: 12px;
      color: #764ba2;
      text-decoration: none;
      cursor: pointer;
    }

    .login-btn {
      width: 100%;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 40px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(118, 75, 162, 0.3);
    }

    .register-link {
      text-align: center;
      margin-top: 24px;
      font-size: 14px;
      color: #8a8fa3;
    }

    .register-link a {
      color: #764ba2;
      text-decoration: none;
      font-weight: 600;
    }

    .register-link a:hover {
      text-decoration: underline;
    }

    /* МОДАЛЬНОЕ ОКНО ЗАБЫЛИ ПАРОЛЬ */
    .reset-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s;
    }

    .reset-modal.show {
      opacity: 1;
      visibility: visible;
    }

    .reset-card {
      background: white;
      border-radius: 32px;
      max-width: 420px;
      width: 90%;
      padding: 28px;
    }

    .reset-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .reset-header i {
      font-size: 28px;
      color: #f59e0b;
    }

    .reset-header h3 {
      font-size: 20px;
      flex: 1;
      margin: 0;
    }

    .reset-close {
      background: #f3f4f6;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      transition: 0.2s;
    }

    .reset-close:hover {
      background: #e5e7eb;
      transform: rotate(90deg);
    }

    .reset-card p {
      font-size: 14px;
      color: #6b6b80;
      margin-bottom: 20px;
    }

    .reset-card input {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid #e2e8f0;
      border-radius: 20px;
      margin-bottom: 20px;
    }

    .reset-card input:focus {
      outline: none;
      border-color: #f59e0b;
    }

    .reset-send {
      width: 100%;
      padding: 12px;
      border-radius: 40px;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: white;
      border: none;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .reset-send:hover {
      transform: translateY(-2px);
    }

    .reset-send:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .toast-message {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #10b981;
      color: white;
      padding: 12px 24px;
      border-radius: 50px;
      z-index: 1100;
      font-size: 14px;
      animation: fadeInUp 0.3s ease;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateX(-50%) translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    }
  </style>
</head>
<body>

<div class="login-card">
  <div class="login-logo">💜</div>
  <h1>Добро пожаловать</h1>
  <p class="login-subtitle">Войдите в свой аккаунт</p>

  <form id="loginForm">
    <div class="form-group">
      <label><i class="fas fa-envelope"></i> Email</label>
      <input type="email" id="loginEmail" placeholder="example@gmail.com">
    </div>
    <div class="form-group">
      <label><i class="fas fa-lock"></i> Пароль</label>
      <input type="password" id="loginPassword" placeholder="Введите пароль">
    </div>
    <div class="forgot-link">
      <a href="#" id="forgotBtn">Забыли пароль?</a>
    </div>
    <button type="submit" class="login-btn">Войти</button>
  </form>

  <div class="register-link">
    Нет аккаунта? <a href="register.html">Зарегистрироваться</a>
  </div>
</div>

<!-- МОДАЛЬНОЕ ОКНО ДЛЯ СБРОСА ПАРОЛЯ -->
<div class="reset-modal" id="resetModal">
  <div class="reset-card">
    <div class="reset-header">
      <i class="fas fa-key"></i>
      <h3>Восстановление пароля</h3>
      <button class="reset-close" id="closeResetBtn">✕</button>
    </div>
    <p>Введите ваш email, и мы отправим инструкцию для сброса пароля.</p>
    <input type="email" id="resetEmail" placeholder="Ваш email">
    <button class="reset-send" id="sendResetBtn">Отправить</button>
  </div>
</div>

<script>
  const resetModal = document.getElementById('resetModal');
  const forgotBtn = document.getElementById('forgotBtn');
  const closeResetBtn = document.getElementById('closeResetBtn');
  const sendResetBtn = document.getElementById('sendResetBtn');
  const resetEmail = document.getElementById('resetEmail');
  const loginForm = document.getElementById('loginForm');
  const loginEmail = document.getElementById('loginEmail');
  const loginPassword = document.getElementById('loginPassword');

  function showToast(message, isError = false) {
    const existing = document.querySelector('.toast-message');
    if (existing) existing.remove();
    const toast = document.createElement('div');
    toast.className = 'toast-message';
    toast.style.background = isError ? '#dc2626' : '#10b981';
    toast.innerHTML = `<i class="fas ${isError ? 'fa-exclamation-triangle' : 'fa-check-circle'}"></i> ${message}`;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 4000);
  }

  // Открыть модальное окно
  forgotBtn.addEventListener('click', (e) => {
    e.preventDefault();
    resetModal.classList.add('show');
    document.body.style.overflow = 'hidden';
    resetEmail.value = '';
  });

  function closeModal() {
    resetModal.classList.remove('show');
    document.body.style.overflow = '';
  }

  closeResetBtn.addEventListener('click', closeModal);
  resetModal.addEventListener('click', (e) => {
    if (e.target === resetModal) closeModal();
  });

  // Отправка запроса на сброс пароля
  sendResetBtn.addEventListener('click', async () => {
    const email = resetEmail.value.trim();
    if (!email) {
      showToast('Введите email', true);
      return;
    }
    
    sendResetBtn.disabled = true;
    sendResetBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Отправка...';
    
    // Имитация отправки (замените на реальный запрос к бэкенду)
    setTimeout(() => {
      showToast(`✅ Инструкция по сбросу пароля отправлена на ${email}`);
      closeModal();
      sendResetBtn.disabled = false;
      sendResetBtn.innerHTML = 'Отправить';
    }, 1500);
  });

  // Вход в аккаунт
  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = loginEmail.value.trim();
    const password = loginPassword.value;
    
    if (!email || !password) {
      showToast('Заполните все поля', true);
      return;
    }
    
    const loginBtn = document.querySelector('.login-btn');
    loginBtn.disabled = true;
    loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Вход...';
    
    // Имитация входа (замените на реальный запрос к бэкенду)
    setTimeout(() => {
      // Для демонстрации: любой email и пароль подходят
      localStorage.setItem('token', 'demo_token');
      localStorage.setItem('userEmail', email);
      localStorage.setItem('userName', 'Пользователь');
      showToast('✅ Успешный вход! Перенаправление...');
      setTimeout(() => {
        window.location.href = 'profile.html';
      }, 1000);
    }, 1000);
  });

  // Проверка авторизации
  if (localStorage.getItem('token')) {
    window.location.href = 'profile.html';
  }
</script>
</body>
</html>
