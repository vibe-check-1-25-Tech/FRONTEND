<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход | Vibe Check</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #f6f1e8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      background: white;
      border-radius: 32px;
      padding: 40px 32px;
      max-width: 450px;
      width: 100%;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
      border: 1px solid #ede7f5;
    }

    .login-logo {
      font-size: 48px;
      text-align: center;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      text-align: center;
      color: #1e1b2e;
      margin-bottom: 8px;
    }

    .login-subtitle {
      text-align: center;
      color: #8a8fa3;
      font-size: 14px;
      margin-bottom: 28px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      font-size: 13px;
      font-weight: 600;
      color: #374151;
      display: block;
      margin-bottom: 6px;
    }

    .form-group label i {
      color: #764ba2;
      margin-right: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid #e2e8f0;
      border-radius: 20px;
      font-size: 14px;
      background: #fafafa;
    }

    .form-group input:focus {
      outline: none;
      border-color: #764ba2;
    }

    .forgot-link {
      text-align: right;
      margin-bottom: 20px;
    }

    .forgot-link a {
      font-size: 12px;
      color: #764ba2;
      text-decoration: none;
      cursor: pointer;
    }

    .login-btn {
      width: 100%;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 40px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .register-link {
      text-align: center;
      margin-top: 24px;
      font-size: 14px;
      color: #8a8fa3;
    }

    .register-link a {
      color: #764ba2;
      text-decoration: none;
      font-weight: 600;
    }

    .reset-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s;
    }

    .reset-modal.show {
      opacity: 1;
      visibility: visible;
    }

    .reset-card {
      background: white;
      border-radius: 32px;
      max-width: 420px;
      width: 90%;
      padding: 28px;
    }

    .toast-message {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #10b981;
      color: white;
      padding: 12px 24px;
      border-radius: 50px;
      z-index: 1100;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="login-card">

  <div class="login-logo">💜</div>

  <h1>Добро пожаловать</h1>

  <p class="login-subtitle">
    Войдите в свой аккаунт
  </p>

  <form id="loginForm">

    <div class="form-group">
      <label>
        <i class="fas fa-envelope"></i>
        Email
      </label>

      <input
        type="email"
        id="loginEmail"
        placeholder="example@gmail.com">
    </div>

    <div class="form-group">
      <label>
        <i class="fas fa-lock"></i>
        Пароль
      </label>

      <input
        type="password"
        id="loginPassword"
        placeholder="Введите пароль">
    </div>

    <div class="forgot-link">
      <a href="#" id="forgotBtn">
        Забыли пароль?
      </a>
    </div>

    <button type="submit" class="login-btn">
      Войти
    </button>

  </form>

  <div class="register-link">
    Нет аккаунта?
    
    <!-- ВОТ ТУТ ИСПРАВЛЕНИЕ -->
    <a href="registr.html">
      Зарегистрироваться
    </a>

  </div>

</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

    const loginForm =
        document.getElementById("loginForm");

    const loginEmail =
        document.getElementById("loginEmail");

    const loginPassword =
        document.getElementById("loginPassword");

    // ===== TOAST =====

    function showToast(
        message,
        isError = false
    ) {

        const oldToast =
            document.querySelector(
                ".toast-message"
            );

        if (oldToast) {
            oldToast.remove();
        }

        const toast =
            document.createElement("div");

        toast.className =
            "toast-message";

        toast.innerText =
            message;

        toast.style.background =
            isError
                ? "#dc2626"
                : "#10b981";

        document.body.appendChild(
            toast
        );

        setTimeout(() => {

            toast.remove();

        }, 3000);

    }

    // ===== LOGIN =====

    loginForm.addEventListener(
        "submit",

        async (e) => {

            e.preventDefault();

            const email =
                loginEmail.value.trim();

            const password =
                loginPassword.value.trim();

            if (!email || !password) {

                showToast(
                    "Заполните все поля",
                    true
                );

                return;
            }

            const loginBtn =
                document.querySelector(
                    ".login-btn"
                );

            loginBtn.disabled = true;

            loginBtn.innerHTML =
                "Вход...";

            try {

                const response =
                    await fetch(
                        "http://localhost:8080/api/login",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                email: email,
                                password: password
                            })
                        }
                    );

                const data =
                    await response.json();

                console.log(data);

                if (!response.ok) {

                    showToast(
                        "Неверный email или пароль",
                        true
                    );

                    loginBtn.disabled = false;

                    loginBtn.innerHTML =
                        "Войти";

                    return;
                }

                // ===== SAVE AUTH =====

                localStorage.setItem(
                    "isAuthenticated",
                    "true"
                );

                localStorage.setItem(
                    "userId",
                    data.user_id
                );

                showToast(
                    "Успешный вход!"
                );

                setTimeout(() => {

                    window.location.href =
                        "loading.html";

                }, 1000);

            } catch (error) {

                console.error(error);

                showToast(
                    "Ошибка сервера",
                    true
                );

                loginBtn.disabled = false;

                loginBtn.innerHTML =
                    "Войти";
            }

        }
    );

});
</script>

</body>
</html>
