<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Регистрация | Vibe Check</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="..//FRONTEND/css/styles.css">
</head>
<body>

<div class="register-page">
  <div class="register-card">
    <div class="register-logo">💜</div>
    <h1>Добро пожаловать</h1>
    <p class="register-subtitle">Создай свой аккаунт и начни отслеживать настроение</p>

    <!-- AVATAR -->
    <div class="register-avatar">
      <div class="avatar-preview">
        <img id="avatarImg" src="https://i.pravatar.cc/150?img=12" alt="Avatar">
      </div>
      <label class="avatar-btn">
        <i class="fa-solid fa-camera"></i> Выбрать фото
        <input type="file" id="avatarUpload" accept="image/*" hidden>
      </label>
    </div>

    <!-- FORM -->
    <form class="register-form" id="registerForm">
      <div class="form-group">
        <label><i class="fa-solid fa-user"></i> Имя</label>
        <input type="text" id="userName" placeholder="Введите имя" required>
      </div>

      <div class="form-group">
        <label><i class="fa-solid fa-envelope"></i> Email</label>
        <input type="email" id="userEmail" placeholder="example@gmail.com" required>
      </div>

      <div class="form-group">
        <label><i class="fa-solid fa-phone"></i> Телефон</label>
        <input type="tel" id="userPhone" placeholder="+996 700 00 00 00" required>
      </div>

      <div class="form-group">
        <label><i class="fa-solid fa-key"></i> Пароль</label>
        <input type="password" id="userPassword" placeholder="Введите пароль" required>
      </div>

      <div class="form-group">
        <label><i class="fa-solid fa-shield-halved"></i> Подтвердите пароль</label>
        <input type="password" id="userConfirmPassword" placeholder="Повторите пароль" required>
      </div>

      <button type="submit" class="register-btn">Создать аккаунт</button>
    </form>

    <div class="login-link">
      Уже есть аккаунт? <a href="login.html">Войти</a>
    </div>
  </div>
</div>

<script src="../js/registr.js"></script>

</body>
</html>
